<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwingClips</title>
<style>
  :root {
    --bg: #f4f6f4; --panel: #ffffff; --text: #17201a; --muted: #5d6b62;
    --line: #dde3de; --accent: #1f8a4c; --accent-text: #ffffff; --sel: #e3f3e9;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1411; --panel: #171e19; --text: #e6ece7; --muted: #93a197;
      --line: #27312a; --accent: #3cb46e; --accent-text: #08120c; --sel: #1d3325;
      --warn: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  /* The hidden attribute must win over the display: flex set on some of these elements. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex;
           align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 18px; }
  header .count { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 900px) {
    main { grid-template-columns: 320px 1fr; height: calc(100vh - 49px); }
    #side { overflow-y: auto; border-right: 1px solid var(--line); }
    #viewer { overflow-y: auto; }
  }
  #listbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line);
             position: sticky; top: 0; background: var(--bg); z-index: 1; }
  #listbar .grow { flex: 1; color: var(--muted); font-size: 13px; }
  /* On phones the player already sticks to the top. */
  @media (max-width: 899px) { #listbar { position: static; } }
  button.danger { color: var(--warn); }
  button.small { padding: 4px 10px; font-size: 13px; }
  .session { border-bottom: 1px solid var(--line); }
  .shead { display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; user-select: none;
           background: var(--panel); }
  .shead .chev { width: 12px; color: var(--muted); transition: transform 0.15s; }
  .session.closed .chev { transform: rotate(-90deg); }
  .shead .stitle { flex: 1; min-width: 0; }
  .shead .sname { font-weight: 600; }
  .shead .ssub { color: var(--muted); font-size: 12px; }
  .session.closed ul { display: none; }
  .session ul { list-style: none; margin: 0; padding: 0; }
  .session li { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 36px;
                border-top: 1px solid var(--line); cursor: pointer; }
  .session li:hover { background: var(--sel); }
  .session li.sel { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
  .session li .info { flex: 1; min-width: 0; }
  .session li .when { font-weight: 600; font-variant-numeric: tabular-nums; }
  .session li .meta { color: var(--muted); font-size: 12px; }
  .session li .pose { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .session li .pose.failed { color: var(--warn); }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10;
           display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 8px;
           background: var(--text); color: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,0.3); max-width: calc(100% - 32px); }
  #toast button { background: transparent; color: var(--bg); border-color: var(--bg); }
  .session li .trash { min-width: 36px; padding: 4px 8px; }
  #shotdata { display: flex; flex-wrap: wrap; gap: 6px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; min-width: 64px; }
  .metric b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .metric span { font-size: 11px; color: var(--muted); }
  .metric.club b { color: var(--accent); }
  #viewer { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  /* Phones: player above the list. Not sticky: it's taller than a phone screen, so pinning it
     would hide its own bottom and cover the list. */
  @media (max-width: 899px) { #viewer { order: -1; border-bottom: 1px solid var(--line); } }
  .stage { position: relative; }
  video { display: block; width: 100%; height: 60vh; background: #000; border-radius: 6px; }
  @media (max-width: 899px) { video { height: 45vh; } }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; min-width: 44px; }
  button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .sep { width: 1px; height: 28px; background: var(--line); }
  #title { color: var(--muted); font-size: 13px; word-break: break-all; }
  #frame { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .empty { padding: 24px 16px; color: var(--muted); }
  #positions { display: flex; flex-direction: column; gap: 8px; }
  .pos-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pos-head strong { font-size: 15px; }
  #pos-note { color: var(--muted); font-size: 13px; }
  #pos-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .pos { flex: 0 0 auto; width: 96px; padding: 0; border-radius: 6px; overflow: hidden; text-align: left;
         background: var(--panel); }
  .pos.here { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .pos canvas { display: block; width: 96px; height: 128px; background: #000; }
  .pos span { display: block; padding: 4px 6px; font-size: 11px; line-height: 1.25; }
  .pos b { color: var(--accent); }
  .pos i { color: var(--warn); font-style: normal; }
</style>
</head>
<body>
<header><h1>SwingClips</h1><span class="count" id="count"></span></header>
<main>
  <aside id="side">
    <div id="listbar"></div>
    <div id="list"></div>
  </aside>
  <section id="viewer" hidden>
    <div class="stage">
      <video id="video" controls playsinline muted preload="auto"></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="controls">
      <button id="prev" title="Previous frame (←)">‹ Frame</button>
      <button id="next" title="Next frame (→)">Frame ›</button>
      <span class="sep"></span>
      <span id="speeds"></span>
      <span class="sep"></span>
      <button id="skeleton" title="Show the pose skeleton (S)">Skeleton</button>
      <button id="delete-clip" class="danger" title="Move this clip to the trash">Delete</button>
      <span id="frame"></span>
    </div>
    <div id="shotdata" hidden title="From the launch monitor, via the shot listener"></div>
    <div id="positions" hidden>
      <div class="pos-head">
        <strong>Key positions</strong>
        <button id="hand" title="Which hand you swing with - sets the lead arm"></button>
      </div>
      <div id="pos-note"></div>
      <div id="pos-list"></div>
    </div>
    <div id="title"></div>
  </section>
</main>
<div id="toast" hidden><span id="toast-text"></span><button id="toast-undo" class="small">Undo</button></div>
<script src="/static/phases.js"></script>
<script>
const SPEEDS = [1, 0.25, 0.125, 0.0625];
const POSE_LABELS = { done: "", processing: "analyzing…", queued: "waiting for analysis", failed: "analysis failed" };

// MediaPipe BlazePose landmark indices and the bones between them (same as the phone app).
const LM = { NOSE: 0, L_SHOULDER: 11, R_SHOULDER: 12, L_ELBOW: 13, R_ELBOW: 14, L_WRIST: 15, R_WRIST: 16,
             L_HIP: 23, R_HIP: 24, L_KNEE: 25, R_KNEE: 26, L_ANKLE: 27, R_ANKLE: 28,
             L_HEEL: 29, R_HEEL: 30, L_FOOT: 31, R_FOOT: 32 };
const SKELETON = [
  [LM.L_SHOULDER, LM.R_SHOULDER],
  [LM.L_SHOULDER, LM.L_ELBOW], [LM.L_ELBOW, LM.L_WRIST],
  [LM.R_SHOULDER, LM.R_ELBOW], [LM.R_ELBOW, LM.R_WRIST],
  [LM.L_SHOULDER, LM.L_HIP], [LM.R_SHOULDER, LM.R_HIP],
  [LM.L_HIP, LM.R_HIP],
  [LM.L_HIP, LM.L_KNEE], [LM.L_KNEE, LM.L_ANKLE],
  [LM.R_HIP, LM.R_KNEE], [LM.R_KNEE, LM.R_ANKLE],
  [LM.L_ANKLE, LM.L_HEEL], [LM.L_HEEL, LM.L_FOOT], [LM.L_ANKLE, LM.L_FOOT],
  [LM.R_ANKLE, LM.R_HEEL], [LM.R_HEEL, LM.R_FOOT], [LM.R_ANKLE, LM.R_FOOT],
];
const JOINTS = [...new Set([...SKELETON.flat(), LM.NOSE])];
// Kept low on purpose: hands are often hidden behind the body mid-swing but still tracked well.
const MIN_VISIBILITY = 0.25;
const BONE_COLOR = "rgba(255, 255, 255, 0.85)", JOINT_COLOR = "#22c55e";
const SPINE_COLOR = "#f59e0b", REF_SPINE_COLOR = "rgba(255, 255, 255, 0.6)";

const list = document.getElementById("list");
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const viewer = document.getElementById("viewer");
const skeletonBtn = document.getElementById("skeleton");

let clips = [];
let current = null;       // name of the open clip
let pose = null;          // { frames: [{t, lm}], reference } for the open clip
let fps = 30;
let speed = 1;
let showSkeleton = true;
try { showSkeleton = localStorage.getItem("skeleton") !== "off"; } catch {}

// Probe clips are named like cam0_1920x1080_240fps_hs_1789123456.mp4 - the number after the size is fps.
function fpsFromName(name) {
  const m = name.match(/_\d+x\d+_(\d+)/);
  return m ? Number(m[1]) : 30;
}

function fmtSize(bytes) {
  return bytes >= 1e9 ? (bytes / 1e9).toFixed(1) + " GB" : (bytes / 1e6).toFixed(1) + " MB";
}

function fmtWhen(iso) {
  return new Date(iso).toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

// ---- Pose geometry ----

function point(lm, i) {
  const v = lm[i * 3 + 2];
  return v >= MIN_VISIBILITY ? { x: lm[i * 3], y: lm[i * 3 + 1] } : null;
}

/** Mid-hip to mid-shoulder, and how far it leans from vertical in the picture (degrees). */
function spineLine(lm) {
  const ls = point(lm, LM.L_SHOULDER), rs = point(lm, LM.R_SHOULDER);
  const lh = point(lm, LM.L_HIP), rh = point(lm, LM.R_HIP);
  if (!ls || !rs || !lh || !rh) return null;
  const shoulder = { x: (ls.x + rs.x) / 2, y: (ls.y + rs.y) / 2 };
  const hip = { x: (lh.x + rh.x) / 2, y: (lh.y + rh.y) / 2 };
  const dx = (shoulder.x - hip.x) * video.videoWidth;
  const dy = (hip.y - shoulder.y) * video.videoHeight;
  return { hip, shoulder, angle: Math.abs(Math.atan2(dx, dy) * 180 / Math.PI) };
}

/** Index of the frame on screen at time t: the last one that starts at or before t. */
function frameIndexAt(t) {
  const f = pose.frames;
  let lo = 0, hi = f.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (f[mid].t <= t + 0.0005) lo = mid; else hi = mid - 1;
  }
  return lo;
}

// ---- Drawing ----

/** Where a picture of the video's shape sits inside a W x H box (letterboxed to keep its shape). */
function fitRect(W, H) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const k = Math.min(W / vw, H / vh);
  return { x: (W - vw * k) / 2, y: (H - vh * k) / 2, w: vw * k, h: vh * k };
}

function drawSpine(ctx, spine, toPx, lineWidth, isReference) {
  const hip = toPx(spine.hip), sh = toPx(spine.shoulder);
  // Extend past the shoulders toward the head so the angle is easy to judge.
  const top = { x: sh.x + (sh.x - hip.x) * 0.35, y: sh.y + (sh.y - hip.y) * 0.35 };
  ctx.save();
  ctx.lineWidth = isReference ? lineWidth * 0.7 : lineWidth * 1.3;
  ctx.strokeStyle = isReference ? REF_SPINE_COLOR : SPINE_COLOR;
  if (isReference) ctx.setLineDash([lineWidth * 3, lineWidth * 2]);
  ctx.beginPath();
  ctx.moveTo(hip.x, hip.y);
  ctx.lineTo(top.x, top.y);
  ctx.stroke();
  ctx.restore();
}

function drawLabel(ctx, text, at, fontSize) {
  ctx.font = `600 ${fontSize}px system-ui, sans-serif`;
  const padX = fontSize * 0.6, h = fontSize * 1.9;
  const w = ctx.measureText(text).width + padX * 2;
  const x = Math.min(Math.max(8, at.x - w / 2), ctx.canvas.width - w - 8);
  const y = Math.min(at.y + fontSize, ctx.canvas.height - h - 8);
  ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, h / 2);
  ctx.fill();
  ctx.fillStyle = SPINE_COLOR;
  ctx.fillText(text, x + padX, y + h * 0.7);
}

/** Skeleton and spine for one frame's landmarks, into rectangle r of ctx's canvas. */
function drawPose(ctx, lm, r, withLabel) {
  const toPx = p => ({ x: r.x + p.x * r.w, y: r.y + p.y * r.h });
  const k = r.w / 400; // sizes were tuned on a ~400px-wide picture in the phone app
  const lineWidth = Math.max(1.5, 3 * k), radius = Math.max(1.5, 4 * k), fontSize = Math.max(12, 14 * k);

  ctx.lineWidth = lineWidth;
  ctx.lineCap = "round";
  ctx.strokeStyle = BONE_COLOR;
  for (const [a, b] of SKELETON) {
    const p = point(lm, a), q = point(lm, b);
    if (!p || !q) continue;
    const P = toPx(p), Q = toPx(q);
    ctx.beginPath();
    ctx.moveTo(P.x, P.y);
    ctx.lineTo(Q.x, Q.y);
    ctx.stroke();
  }
  ctx.fillStyle = JOINT_COLOR;
  for (const i of JOINTS) {
    const p = point(lm, i);
    if (!p) continue;
    const P = toPx(p);
    ctx.beginPath();
    ctx.arc(P.x, P.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  if (pose.reference) drawSpine(ctx, pose.reference, toPx, lineWidth, true);
  const spine = spineLine(lm);
  if (spine) {
    drawSpine(ctx, spine, toPx, lineWidth, false);
    if (withLabel) {
      const text = pose.reference
        ? `Spine ${spine.angle.toFixed(0)}°  (start ${pose.reference.angle.toFixed(0)}°)`
        : `Spine ${spine.angle.toFixed(0)}°`;
      drawLabel(ctx, text, toPx(spine.hip), fontSize);
    }
  }
}

function draw(t) {
  const dpr = window.devicePixelRatio || 1;
  const W = Math.round(canvas.clientWidth * dpr), H = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, W, H);
  showFrameLabel(t);
  markPosition(t);
  if (!showSkeleton || !pose || !pose.frames.length || !video.videoWidth) return;
  const lm = pose.frames[frameIndexAt(t)].lm;
  if (lm) drawPose(ctx, lm, fitRect(W, H), true);
}

function showFrameLabel(t) {
  const el = document.getElementById("frame");
  if (pose && pose.frames.length) {
    el.textContent = `frame ${frameIndexAt(t) + 1} of ${pose.frames.length} · ${fps} fps`;
  } else {
    el.textContent = `frame ${Math.floor(t * fps + 0.01)} · ${fps} fps`;
  }
}

// Redraw on every frame the browser actually presents, using that frame's own timestamp.
function onVideoFrame(_now, meta) {
  draw(meta.mediaTime);
  video.requestVideoFrameCallback(onVideoFrame);
}
if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
  video.requestVideoFrameCallback(onVideoFrame);
} else {
  video.addEventListener("timeupdate", () => draw(video.currentTime));
}
video.addEventListener("seeked", () => draw(video.currentTime));
video.addEventListener("loadedmetadata", () => draw(video.currentTime));
new ResizeObserver(() => draw(video.currentTime)).observe(canvas);

// ---- Controls ----

function setSpeed(s) {
  speed = s;
  video.playbackRate = s;
  document.querySelectorAll("#speeds button").forEach(b => b.classList.toggle("on", Number(b.dataset.s) === s));
}

function step(frames) {
  video.pause();
  if (pose && pose.frames.length) {
    // Real frame timestamps: phone clips drop frames now and then, so 1/fps steps would drift.
    const f = pose.frames;
    const i = Math.max(0, Math.min(f.length - 1, frameIndexAt(video.currentTime) + frames));
    // Aim between this frame's start and the next one's, not at the exact edge.
    video.currentTime = i + 1 < f.length ? (f[i].t + f[i + 1].t) / 2 : f[i].t + 0.001;
    return;
  }
  const cur = Math.floor(video.currentTime * fps + 0.01);
  const last = Math.floor((video.duration || 0) * fps) - 1;
  video.currentTime = (Math.max(0, Math.min(last, cur + frames)) + 0.5) / fps;
}

function setSkeleton(on) {
  showSkeleton = on;
  skeletonBtn.classList.toggle("on", on);
  try { localStorage.setItem("skeleton", on ? "on" : "off"); } catch {}
  draw(video.currentTime);
}

function updateSkeletonButton() {
  const c = clips.find(c => c.name === current);
  const state = c ? c.pose : "done";
  skeletonBtn.disabled = !pose;
  skeletonBtn.textContent = pose ? "Skeleton" : `Skeleton (${POSE_LABELS[state] || "loading…"})`;
}

async function loadPose(name) {
  pose = null;
  updateSkeletonButton();
  const c = clips.find(c => c.name === name);
  if (!c || c.pose !== "done") return;
  const res = await fetch("/api/pose/" + encodeURIComponent(name));
  if (!res.ok || current !== name) return;
  const data = await res.json();
  if (current !== name) return;
  // The address position: the first frame where the spine can be measured.
  let reference = null;
  for (const f of data.frames) {
    if (f.lm && (reference = spineLine(f.lm))) break;
  }
  pose = { frames: data.frames, reference, impact: data.impact ?? null };
  updateSkeletonButton();
  draw(video.currentTime);
  buildPositions(name);
}

// ---- Key positions ----

const positionsBox = document.getElementById("positions");
const posList = document.getElementById("pos-list");
const handBtn = document.getElementById("hand");
// A second, hidden player to grab the thumbnails, so the visible one isn't disturbed.
const thumbVideo = Object.assign(document.createElement("video"), { muted: true, playsInline: true, preload: "auto" });
let positions = [];
let positionsRun = 0;
let leadSide = "left";
try { if (localStorage.getItem("lead") === "right") leadSide = "right"; } catch {}

function whenReady(v, event, test) {
  return test() ? Promise.resolve() : new Promise(r => v.addEventListener(event, r, { once: true }));
}

/**
 * One crop (in video pixels, card-shaped) around the golfer in all the positions, so the
 * thumbnails show the swing rather than the whole room, and line up with each other.
 */
function cropFor(list, cardAspect) {
  const vw = video.videoWidth, vh = video.videoHeight;
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (const p of list) {
    const lm = pose.frames[p.index].lm;
    if (!lm) continue;
    for (let i = 0; i < 33; i++) {
      if (lm[i * 3 + 2] < MIN_VISIBILITY) continue;
      x0 = Math.min(x0, lm[i * 3]); x1 = Math.max(x1, lm[i * 3]);
      y0 = Math.min(y0, lm[i * 3 + 1]); y1 = Math.max(y1, lm[i * 3 + 1]);
    }
  }
  if (x1 <= x0 || y1 <= y0) return { x: 0, y: 0, w: vw, h: vh };
  // Room for the club: most above the head (the top of the swing), some to the sides.
  let w = (x1 - x0) * vw * 1.6, h = (y1 - y0) * vh * 1.5;
  const cx = (x0 + x1) / 2 * vw, cy = ((y0 + y1) / 2 - (y1 - y0) * 0.12) * vh;
  if (w / h > cardAspect) h = w / cardAspect; else w = h * cardAspect;
  w = Math.min(w, vw); h = Math.min(h, vh);
  return {
    x: Math.max(0, Math.min(vw - w, cx - w / 2)),
    y: Math.max(0, Math.min(vh - h, cy - h / 2)),
    w, h,
  };
}

async function grabThumb(canvasEl, p, crop) {
  thumbVideo.currentTime = p.t + 0.001;
  await new Promise(r => thumbVideo.addEventListener("seeked", r, { once: true }));
  const ctx = canvasEl.getContext("2d");
  const W = canvasEl.width, H = canvasEl.height;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(thumbVideo, crop.x, crop.y, crop.w, crop.h, 0, 0, W, H);
  // Where the whole picture would land at this crop, so landmarks map onto the card.
  const sx = W / crop.w, sy = H / crop.h;
  const r = { x: -crop.x * sx, y: -crop.y * sy, w: video.videoWidth * sx, h: video.videoHeight * sy };
  const lm = pose.frames[p.index].lm;
  if (lm) drawPose(ctx, lm, r, false);
}

async function buildPositions(name) {
  const run = ++positionsRun;
  handBtn.textContent = leadSide === "left" ? "Right-handed" : "Left-handed";
  await whenReady(video, "loadedmetadata", () => video.videoWidth > 0);
  if (run !== positionsRun || current !== name || !pose) return;
  // Impact is when the ball leaves the mat, if the server saw it go. If not: the capture app cuts
  // each clip 2 s before the strike it heard, starting on a keyframe (every 0.25 s), so the strike
  // is about 2.0-2.25 s in; real impacts have landed 1.97-2.33 s in, so allow a little either side.
  const strikeWindow = name.startsWith("swing_") ? [1.9, 2.4] : null;
  positions = SwingPhases.detect(pose.frames, video.videoWidth / video.videoHeight, leadSide, strikeWindow,
                                 pose.impact);
  positionsBox.hidden = false;
  document.getElementById("pos-note").textContent = positions.length
    ? "Tap one to jump there. ~ = estimated (depends on the club, which isn't tracked)."
    : "No swing found in this clip.";

  const cards = positions.map(p => {
    const b = document.createElement("button");
    b.className = "pos";
    b.title = `${p.tag} ${p.label} - ${p.t.toFixed(3)} s`;
    b.innerHTML = `<canvas width="192" height="256"></canvas><span><b></b> <i></i><br></span>`;
    b.querySelector("b").textContent = p.tag;
    b.querySelector("i").textContent = p.estimated ? "~" : "";
    b.querySelector("span").append(p.label);
    b.onclick = () => jumpTo(p.index);
    return b;
  });
  posList.replaceChildren(...cards);
  markPosition(video.currentTime);

  thumbVideo.src = video.src;
  await whenReady(thumbVideo, "loadeddata", () => thumbVideo.readyState >= 2);
  const crop = cropFor(positions, 192 / 256);
  for (let i = 0; i < cards.length; i++) {
    if (run !== positionsRun) return;
    await grabThumb(cards[i].querySelector("canvas"), positions[i], crop);
  }
}

function jumpTo(index) {
  video.pause();
  const f = pose.frames;
  video.currentTime = index + 1 < f.length ? (f[index].t + f[index + 1].t) / 2 : f[index].t + 0.001;
}

/** Highlight the position card for the frame on screen, if it's one of them. */
function markPosition(t) {
  if (!positions.length || !pose) return;
  const i = frameIndexAt(t);
  posList.querySelectorAll(".pos").forEach((b, k) => b.classList.toggle("here", positions[k].index === i));
}

handBtn.onclick = () => {
  leadSide = leadSide === "left" ? "right" : "left";
  try { localStorage.setItem("lead", leadSide); } catch {}
  if (pose && current) buildPositions(current);
};

function open(name) {
  current = name;
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("sel", li.dataset.name === name));
  // Opening a clip in a closed session opens the session.
  const row = document.querySelector(`#list li[data-name="${CSS.escape(name)}"]`);
  row?.closest(".session")?.classList.remove("closed");
  fps = fpsFromName(name);
  pose = null;
  positions = [];
  positionsRun++;
  positionsBox.hidden = true;
  posList.replaceChildren();
  video.src = "/clips/" + encodeURIComponent(name);
  video.playbackRate = speed;
  document.getElementById("title").textContent = name;
  viewer.hidden = false;
  history.replaceState(null, "", "#" + encodeURIComponent(name));
  showShot(clips.find(c => c.name === name));
  loadPose(name);
}

// ---- Launch monitor numbers ----

const CLUB_NAMES = { DR: "Driver", PW: "PW", GW: "GW", SW: "SW", LW: "LW", PT: "Putter" };
function clubName(code) {
  if (!code) return "";
  if (CLUB_NAMES[code]) return CLUB_NAMES[code];
  const m = code.match(/^([WHI])(\d)$/);
  return m ? `${m[2]}${{ W: " wood", H: " hybrid", I: " iron" }[m[1]]}` : code;
}

const num = (v, d = 1) => (v === null || v === undefined || isNaN(v)) ? "–" : Number(v).toFixed(d);
const signed = v => (v > 0 ? "+" : "") + num(v);
// Launch monitors report left as negative.
const side = v => Math.abs(v) < 0.05 ? "0.0°" : `${num(Math.abs(v))}° ${v < 0 ? "L" : "R"}`;

function showShot(c) {
  const box = document.getElementById("shotdata");
  const s = c && c.shot;
  if (!s) { box.hidden = true; box.replaceChildren(); return; }
  const b = s.ball || {}, k = s.clubData || {};
  const has = v => v !== null && v !== undefined && !isNaN(v);
  // Only what this shot's source reported: Square's app gives carry, club speed and more; its GSPro
  // connector doesn't.
  const items = [["club", clubName(s.club), "Club"]];
  const add = (ok, value, label) => { if (ok) items.push(["", value, label]); };
  add(b.carry > 0, `${num(b.carry, 0)}`, "Carry yd");
  add(b.total > 0, `${num(b.total, 0)}`, "Total yd");
  add(has(b.speed), num(b.speed), "Ball mph");
  add(k.speed > 0, num(k.speed), "Club mph");
  add(k.smash > 0, num(k.smash, 2), "Smash");
  add(has(b.vla), `${num(b.vla)}°`, "Launch");
  add(has(b.hla), side(b.hla), "Direction");
  add(has(b.side), side(b.side).replace("°", " yd"), "Offline");
  add(has(b.totalSpin), num(b.totalSpin, 0), "Spin rpm");
  add(has(b.spinAxis), side(b.spinAxis), "Spin axis");
  add(b.apexFt > 0, num(b.apexFt, 0), "Apex ft");
  add(has(k.angleOfAttack), `${signed(k.angleOfAttack)}°`, "Attack");
  add(has(k.path), `${signed(k.path)}°`, "Path");
  add(has(k.faceToTarget), `${signed(k.faceToTarget)}°`, "Face");
  add(k.loft > 0, `${num(k.loft)}°`, "Dyn. loft");
  box.replaceChildren(...items.map(([cls, value, label]) => {
    const el = document.createElement("div");
    el.className = "metric " + cls;
    el.innerHTML = "<b></b><span></span>";
    el.querySelector("b").textContent = value;
    el.querySelector("span").textContent = label;
    return el;
  }));
  box.hidden = false;
}

// ---- Clip list, grouped into sessions ----

// Clips less than this far apart belong to the same session (one trip to the bay).
const SESSION_GAP_MS = 45 * 60 * 1000;
const listbar = document.getElementById("listbar");
let selecting = false;
const selected = new Set();
// Sessions the viewer opened or closed by hand, by key; the rest: newest open, others closed.
let openState = {};
try { openState = JSON.parse(localStorage.getItem("sessions") || "{}"); } catch {}

/** Newest-first clips -> newest-first sessions, each with its clips newest first. */
function sessionsOf(list) {
  const out = [];
  for (const c of list) {
    const t = new Date(c.recorded).getTime();
    const s = out[out.length - 1];
    if (s && s.start - t < SESSION_GAP_MS) { s.clips.push(c); s.start = t; }
    else out.push({ clips: [c], start: t, end: t });
  }
  // Keyed by its first clip, which doesn't change as new swings are added at the end.
  for (const s of out) s.key = s.clips[s.clips.length - 1].name;
  return out;
}

function sessionTitle(s) {
  const start = new Date(s.start), end = new Date(s.end);
  const day = new Date(start); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - day) / 86400000);
  const date = days === 0 ? "Today" : days === 1 ? "Yesterday"
    : start.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  const time = d => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  return s.clips.length === 1 ? `${date} · ${time(start)}` : `${date} · ${time(start)} – ${time(end)}`;
}

/** "240 fps · 1080p" from names like swing_1920x1080_240fps_... or cam0_1920x1080_240fps_hs_... */
function modeOf(name) {
  const m = name.match(/_(\d+)x(\d+)_(\d+)/);
  return m ? `${m[3]} fps · ${Math.min(+m[1], +m[2])}p` : "";
}

function renderListbar() {
  if (selecting) {
    listbar.innerHTML = `<span class="grow"></span><button class="small danger" id="del-sel">Delete</button>` +
      `<button class="small" id="cancel-sel">Done</button>`;
    listbar.querySelector(".grow").textContent = selected.size ? `${selected.size} selected` : "Tick clips to delete";
    listbar.querySelector("#del-sel").disabled = !selected.size;
    listbar.querySelector("#del-sel").onclick = () => deleteClips([...selected]);
    listbar.querySelector("#cancel-sel").onclick = () => { selecting = false; selected.clear(); renderList(); };
  } else {
    listbar.innerHTML = `<span class="grow"></span><button class="small" id="start-sel">Select</button>`;
    listbar.querySelector(".grow").textContent = clips.length ? "" : "";
    listbar.querySelector("#start-sel").disabled = !clips.length;
    listbar.querySelector("#start-sel").onclick = () => { selecting = true; renderList(); };
  }
}

function clipRow(c) {
  const li = document.createElement("li");
  li.dataset.name = c.name;
  li.classList.toggle("sel", c.name === current);
  li.innerHTML = `<div class="info"><div class="when"></div><div class="meta"></div></div><span class="pose"></span>`;
  li.querySelector(".when").textContent = new Date(c.recorded)
    .toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" });
  const shotText = !c.shot ? "" : c.shot.ball?.carry > 0
    ? `${clubName(c.shot.club)} ${num(c.shot.ball.carry, 0)} yd`
    : `${clubName(c.shot.club)} ${num(c.shot.ball?.speed)} mph`;
  li.querySelector(".meta").textContent = [shotText, modeOf(c.name), fmtSize(c.size)].filter(Boolean).join(" · ");
  const p = li.querySelector(".pose");
  p.textContent = POSE_LABELS[c.pose] || "";
  p.classList.toggle("failed", c.pose === "failed");
  if (selecting) {
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = selected.has(c.name);
    box.onclick = e => e.stopPropagation();
    box.onchange = () => { box.checked ? selected.add(c.name) : selected.delete(c.name); renderList(); };
    li.prepend(box);
    li.onclick = () => box.click();
  } else {
    li.onclick = () => open(c.name);
    const del = document.createElement("button");
    del.className = "small danger trash";
    del.textContent = "🗑";
    del.title = "Move this clip to the trash";
    del.setAttribute("aria-label", "Delete clip");
    del.onclick = e => { e.stopPropagation(); deleteClips([c.name]); };
    li.append(del);
  }
  return li;
}

function renderList() {
  document.getElementById("count").textContent = `${clips.length} clip${clips.length === 1 ? "" : "s"}`;
  for (const n of [...selected]) if (!clips.some(c => c.name === n)) selected.delete(n);
  renderListbar();
  if (!clips.length) {
    list.innerHTML = `<div class="empty">No clips yet. Swings from the SwingClips phone app show up here.</div>`;
    return;
  }
  const sessions = sessionsOf(clips);
  list.replaceChildren(...sessions.map((s, i) => {
    const el = document.createElement("section");
    el.className = "session";
    const isOpen = openState[s.key] ?? (i === 0 || s.clips.some(c => c.name === current));
    el.classList.toggle("closed", !isOpen);

    const head = document.createElement("div");
    head.className = "shead";
    head.innerHTML = `<span class="chev">▾</span><div class="stitle"><div class="sname"></div><div class="ssub"></div></div>`;
    head.querySelector(".sname").textContent = sessionTitle(s);
    head.querySelector(".ssub").textContent = `${s.clips.length} clip${s.clips.length === 1 ? "" : "s"}`;
    if (selecting) {
      const all = document.createElement("input");
      all.type = "checkbox";
      all.title = "Select this whole session";
      all.checked = s.clips.every(c => selected.has(c.name));
      all.onclick = e => e.stopPropagation();
      all.onchange = () => {
        for (const c of s.clips) all.checked ? selected.add(c.name) : selected.delete(c.name);
        renderList();
      };
      head.append(all);
    } else {
      const del = document.createElement("button");
      del.className = "small danger";
      del.textContent = "Delete";
      del.title = "Move this whole session to the trash";
      del.onclick = e => {
        e.stopPropagation();
        const n = s.clips.length;
        if (confirm(`Delete this session (${sessionTitle(s)}, ${n} clip${n === 1 ? "" : "s"})?\n\n` +
                    "They go to the trash folder on the server, and you can undo right after.")) {
          deleteClips(s.clips.map(c => c.name));
        }
      };
      head.append(del);
    }
    head.onclick = () => {
      const nowOpen = el.classList.toggle("closed") === false;
      openState[s.key] = nowOpen;
      try { localStorage.setItem("sessions", JSON.stringify(openState)); } catch {}
    };

    const ul = document.createElement("ul");
    ul.replaceChildren(...s.clips.map(clipRow));
    el.append(head, ul);
    return el;
  }));
}

// ---- Deleting ----

const toast = document.getElementById("toast");
let toastTimer = 0;

function showToast(text, onUndo) {
  document.getElementById("toast-text").textContent = text;
  const undo = document.getElementById("toast-undo");
  undo.hidden = !onUndo;
  undo.onclick = async () => { toast.hidden = true; await onUndo(); };
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 8000);
}

async function deleteClips(names) {
  if (!names.length) return;
  // Let go of the video first: Windows can't move a file the server is still streaming.
  if (names.includes(current)) {
    const order = clips.map(c => c.name);
    const next = order.slice(order.indexOf(current) + 1).find(n => !names.includes(n))
      ?? order.slice(0, order.indexOf(current)).reverse().find(n => !names.includes(n));
    closeViewer();
    if (next) open(next);
  }
  const res = await fetch("/api/delete", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ names }),
  });
  if (!res.ok) { showToast("Couldn't delete - is the server up to date?"); return; }
  const { moved } = await res.json();
  selecting = false;
  selected.clear();
  clips = clips.filter(c => !moved.includes(c.name));
  renderList();
  showToast(`${moved.length} clip${moved.length === 1 ? "" : "s"} moved to the trash`, async () => {
    await fetch("/api/restore", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ names: moved }),
    });
    await refresh();
  });
}

function closeViewer() {
  current = null;
  pose = null;
  positions = [];
  positionsRun++;
  video.removeAttribute("src");
  video.load();
  thumbVideo.removeAttribute("src");
  thumbVideo.load();
  viewer.hidden = true;
  showShot(null);
  history.replaceState(null, "", location.pathname);
}

document.getElementById("delete-clip").onclick = () => { if (current) deleteClips([current]); };

async function refresh() {
  let res;
  try {
    res = await fetch("/api/clips");
  } catch {
    // Server restarting or off: keep what's on screen, say so, and try again on the next tick.
    document.getElementById("count").textContent = "can't reach the server";
    return;
  }
  if (!res.ok) {
    list.innerHTML = `<div class="empty">${(await res.json()).detail || "Couldn't load clips."}</div>`;
    return;
  }
  const before = clips.find(c => c.name === current);
  clips = await res.json();
  renderList();
  if (current === null && clips.length) {
    const wanted = decodeURIComponent(location.hash.slice(1));
    open(clips.some(c => c.name === wanted) ? wanted : clips[0].name);
  } else {
    // The open clip's pose may have just finished, or its shot just arrived.
    const now = clips.find(c => c.name === current);
    showShot(now);
    if (now && now.pose === "done" && (!before || before.pose !== "done")) loadPose(current);
    else updateSkeletonButton();
  }
}

document.getElementById("speeds").replaceChildren(...SPEEDS.map(s => {
  const b = document.createElement("button");
  b.dataset.s = s;
  b.textContent = s === 1 ? "1×" : "1/" + (1 / s) + "×";
  b.onclick = () => setSpeed(s);
  return b;
}));
setSpeed(1);
setSkeleton(showSkeleton);
skeletonBtn.onclick = () => setSkeleton(!showSkeleton);
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  if (e.key === "s" || e.key === "S") setSkeleton(!showSkeleton);
});

// Pick up new clips and finished analyses without a manual reload.
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 10000);
</script>
</body>
</html>
